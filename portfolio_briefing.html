<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ポートフォリオ ブリーフィング</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #0f1b2d;
  --bg-2: #142540;
  --card: #ffffff;
  --card-2: #f4f7fb;
  --ink: #1a2842;
  --muted: #6b7a90;
  --border: #e3e9f2;
  --accent: #1f3a68;
  --accent-strong: #14274a;
  --green: #1e9e6a;
  --green-soft: #e6f6ee;
  --red: #d64545;
  --red-soft: #fceaea;
  --amber: #c98a18;
  --amber-soft: #fdf3df;
  --shadow: 0 6px 18px rgba(15, 27, 45, 0.08);
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: linear-gradient(180deg, #0f1b2d 0%, #142540 280px, #f4f7fb 280px, #f4f7fb 100%);
  color: var(--ink);
  font-family: "Noto Sans JP", -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Meiryo", sans-serif;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
.container { max-width: 1200px; margin: 0 auto; padding: 28px 22px 56px; }

header.top { color: #fff; margin-bottom: 22px; }
header.top .title-row {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 12px; flex-wrap: wrap;
}
header.top h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: 0.04em; }
header.top .updated { font-size: 13px; color: rgba(255,255,255,0.78); }
header.top .caveat {
  margin-top: 10px;
  font-size: 12px;
  color: rgba(255,255,255,0.7);
  line-height: 1.6;
  max-width: 900px;
}

.summary {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
  margin-top: 18px;
}
.card {
  background: var(--card);
  border-radius: 12px;
  box-shadow: var(--shadow);
  padding: 18px 20px;
}
.kpi .label { font-size: 11px; color: var(--muted); font-weight: 500; letter-spacing: 0.06em; }
.kpi .value { margin-top: 6px; font-size: 22px; font-weight: 700; color: var(--ink); }
.kpi.pl .value { font-size: 26px; }
.kpi.pl .sub { margin-top: 2px; font-size: 14px; font-weight: 700; }
.kpi.counts .breakdown { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
.pos { color: var(--green) !important; }
.neg { color: var(--red) !important; }

.section-title {
  font-size: 14px; font-weight: 700; color: var(--accent-strong);
  margin: 0 0 12px; letter-spacing: 0.04em;
}
.toolbar {
  display: flex; gap: 10px; flex-wrap: wrap;
  margin: 22px 0 14px;
  align-items: center;
}
.toolbar .group { display: flex; gap: 6px; flex-wrap: wrap; }
.toolbar .label-sm { font-size: 11px; color: rgba(255,255,255,0.7); margin-right: 4px; letter-spacing: 0.04em; }
.toolbar button, .toolbar select {
  background: rgba(255,255,255,0.95);
  color: var(--accent-strong);
  border: 1px solid transparent;
  padding: 7px 14px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.15s ease;
}
.toolbar select { padding: 7px 30px 7px 14px; appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--accent-strong) 50%), linear-gradient(135deg, var(--accent-strong) 50%, transparent 50%); background-position: calc(100% - 14px) 50%, calc(100% - 9px) 50%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
.toolbar button.active { background: var(--accent-strong); color: #fff; }
.toolbar button:hover { background: #fff; }

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
  gap: 16px;
}
.stock {
  background: #fff;
  border-radius: 14px;
  box-shadow: var(--shadow);
  padding: 18px 20px 16px;
  display: flex; flex-direction: column;
  cursor: pointer;
  border: 1px solid transparent;
  transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
}
.stock:hover { transform: translateY(-2px); border-color: var(--border); box-shadow: 0 12px 28px rgba(15,27,45,0.12); }

.stock-head {
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 10px; margin-bottom: 12px;
}
.stock-name { font-weight: 700; font-size: 16px; color: var(--ink); line-height: 1.35; }
.stock-code { font-size: 12px; color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; }

.badge {
  display: inline-block; padding: 3px 10px; border-radius: 999px;
  font-size: 11px; font-weight: 700; letter-spacing: 0.04em;
  white-space: nowrap;
}
.badge-sell { background: var(--red-soft); color: var(--red); }
.badge-watch { background: var(--amber-soft); color: var(--amber); }
.badge-hold  { background: var(--green-soft); color: var(--green); }

.metrics {
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px;
  padding: 12px 0 14px;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  margin-bottom: 12px;
}
.metric .k { font-size: 11px; color: var(--muted); letter-spacing: 0.04em; }
.metric .v { font-size: 14px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.metric .v.pos { color: var(--green); }
.metric .v.neg { color: var(--red); }
.metric.pl .v { font-size: 16px; }

.news { margin-bottom: 10px; }
.news-title { font-size: 11px; color: var(--muted); letter-spacing: 0.06em; margin-bottom: 6px; }
.news ul { margin: 0; padding: 0; list-style: none; }
.news li { padding: 6px 0; border-bottom: 1px dashed var(--border); }
.news li:last-child { border-bottom: none; }
.news a {
  color: var(--accent); text-decoration: none; font-size: 13px; font-weight: 500;
  display: inline-block; line-height: 1.4;
}
.news a:hover { text-decoration: underline; }
.news .meta { font-size: 11px; color: var(--muted); margin-top: 3px; }

.observations {
  background: var(--card-2);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 12px;
  color: var(--ink);
}
.observations .k { font-size: 11px; color: var(--muted); letter-spacing: 0.06em; margin-bottom: 6px; }
.observations ul { margin: 0; padding-left: 18px; }
.observations li { line-height: 1.6; margin-bottom: 2px; }

.empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 32px 0; font-size: 14px; }

/* Modal */
.modal-back {
  position: fixed; inset: 0;
  background: rgba(15, 27, 45, 0.55);
  display: none;
  align-items: flex-start; justify-content: center;
  z-index: 100;
  padding: 32px 16px;
  overflow-y: auto;
}
.modal-back.open { display: flex; }
.modal {
  background: #fff; border-radius: 16px;
  width: 100%; max-width: 760px;
  padding: 24px 28px 22px;
  box-shadow: 0 24px 80px rgba(15,27,45,0.32);
}
.modal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
.modal-close {
  background: transparent; border: none; font-size: 22px; cursor: pointer;
  color: var(--muted); line-height: 1;
}
.modal-close:hover { color: var(--ink); }
.modal h2 { margin: 0; font-size: 18px; }
.modal h2 .code { font-size: 13px; color: var(--muted); margin-left: 8px; font-weight: 500; }
.modal .grid-charts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px; }
.modal .chart-card-modal {
  background: var(--card-2); border-radius: 10px; padding: 12px 14px;
}
.modal .chart-card-modal .k { font-size: 11px; color: var(--muted); margin-bottom: 6px; letter-spacing: 0.06em; }
.modal .chart-wrap-modal { position: relative; height: 160px; }
.modal .modal-news { margin-top: 4px; }
.modal .modal-news h3 { font-size: 13px; margin: 14px 0 8px; color: var(--accent-strong); letter-spacing: 0.04em; }
.modal .modal-news article { padding: 10px 0; border-bottom: 1px solid var(--border); }
.modal .modal-news article:last-child { border-bottom: none; }
.modal .modal-news .ttl { font-size: 14px; font-weight: 600; }
.modal .modal-news .ttl a { color: var(--accent); text-decoration: none; }
.modal .modal-news .ttl a:hover { text-decoration: underline; }
.modal .modal-news .meta { font-size: 11px; color: var(--muted); margin: 3px 0 6px; }
.modal .modal-news .sum { font-size: 13px; line-height: 1.6; color: var(--ink); }
.modal .caveat-small {
  font-size: 11px; color: var(--muted); margin-top: 12px; line-height: 1.6;
}

@media (max-width: 880px) {
  .summary { grid-template-columns: 1fr 1fr; }
  .modal .grid-charts { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  .summary { grid-template-columns: 1fr; }
  header.top h1 { font-size: 18px; }
  .kpi.pl .value { font-size: 22px; }
  html, body { background: linear-gradient(180deg, #0f1b2d 0%, #142540 360px, #f4f7fb 360px, #f4f7fb 100%); }
  .modal { padding: 18px 16px; }
}
</style>
</head>
<body>
<div class="container">
  <header class="top">
    <div class="title-row">
      <h1>ポートフォリオ ブリーフィング</h1>
      <div class="updated">最終更新: <span id="updated-at"></span></div>
    </div>
    <div class="caveat" id="caveat"></div>

    <div class="summary">
      <div class="card kpi">
        <div class="label">総取得額</div>
        <div class="value" id="kpi-cost"></div>
      </div>
      <div class="card kpi">
        <div class="label">現在評価額</div>
        <div class="value" id="kpi-value"></div>
      </div>
      <div class="card kpi pl">
        <div class="label">含み損益</div>
        <div class="value" id="kpi-pl"></div>
        <div class="sub" id="kpi-pl-pct"></div>
      </div>
      <div class="card kpi counts">
        <div class="label">保有銘柄（<span id="kpi-n"></span>件）</div>
        <div class="breakdown" id="kpi-counts"></div>
      </div>
    </div>

    <div class="toolbar">
      <span class="label-sm">フィルタ</span>
      <div class="group" id="filter-bar">
        <button data-filter="all" class="active">全件</button>
        <button data-filter="sell">売却検討のみ</button>
        <button data-filter="watch+">様子見以上</button>
      </div>
      <span class="label-sm" style="margin-left:8px;">ソート</span>
      <select id="sort-select">
        <option value="pl_desc">含み損益（多い順）</option>
        <option value="pl_asc">含み損益（少ない順）</option>
        <option value="pct_desc">騰落率（高い順）</option>
        <option value="pct_asc">騰落率（低い順）</option>
        <option value="name_asc">銘柄名（あいうえお順）</option>
      </select>
    </div>
  </header>

  <div class="cards" id="cards"></div>
</div>

<div class="modal-back" id="modal-back">
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>

const yen = (n) => "¥" + Math.round(n).toLocaleString("ja-JP");
const yenSigned = (n) => (n >= 0 ? "+" : "-") + "¥" + Math.round(Math.abs(n)).toLocaleString("ja-JP");
const pct = (n) => (n >= 0 ? "+" : "") + n.toFixed(2) + "%";
const fmtPrice = (n) => n == null ? "N/A" : "¥" + n.toLocaleString("ja-JP", { minimumFractionDigits: 0, maximumFractionDigits: 2 });

const CATEGORY_BADGE = {
  "売却検討": { cls: "badge-sell", short: "売却検討" },
  "様子見":   { cls: "badge-watch", short: "様子見" },
  "継続保有": { cls: "badge-hold",  short: "継続保有" },
};

const state = { filter: "all", sort: "pl_desc" };

document.getElementById("updated-at").textContent = DATA.updated_at;
document.getElementById("caveat").textContent = DATA.data_caveat;

function renderSummary() {
  const s = DATA.summary;
  document.getElementById("kpi-cost").textContent = yen(s.total_cost);
  document.getElementById("kpi-value").textContent = yen(s.total_value);
  const plEl = document.getElementById("kpi-pl");
  const pctEl = document.getElementById("kpi-pl-pct");
  plEl.textContent = yenSigned(s.total_pl);
  pctEl.textContent = pct(s.total_pl_pct);
  const cls = s.total_pl >= 0 ? "pos" : "neg";
  plEl.classList.add(cls);
  pctEl.classList.add(cls);

  document.getElementById("kpi-n").textContent = s.n_holdings;
  const cwrap = document.getElementById("kpi-counts");
  const order = ["売却検討", "様子見", "継続保有"];
  cwrap.innerHTML = order.map((k) => {
    const c = s.counts[k] || 0;
    const b = CATEGORY_BADGE[k];
    return `<span class="badge ${b.cls}">${b.short} ${c}</span>`;
  }).join("");
}

function getFiltered() {
  if (state.filter === "sell") return DATA.holdings.filter((h) => h.category === "売却検討");
  if (state.filter === "watch+") return DATA.holdings.filter((h) => h.category === "売却検討" || h.category === "様子見");
  return DATA.holdings.slice();
}

function getSorted(rows) {
  const r = rows.slice();
  switch (state.sort) {
    case "pl_desc":  return r.sort((a,b) => (b.pl ?? -Infinity) - (a.pl ?? -Infinity));
    case "pl_asc":   return r.sort((a,b) => (a.pl ?? Infinity) - (b.pl ?? Infinity));
    case "pct_desc": return r.sort((a,b) => (b.pl_pct ?? -Infinity) - (a.pl_pct ?? -Infinity));
    case "pct_asc":  return r.sort((a,b) => (a.pl_pct ?? Infinity) - (b.pl_pct ?? Infinity));
    case "name_asc": return r.sort((a,b) => String(a.name).localeCompare(String(b.name), "ja"));
  }
  return r;
}

function newsList(items, limit) {
  if (!items || items.length === 0) {
    return `<div class="meta">直近のニュース取得なし</div>`;
  }
  const li = items.slice(0, limit).map((n) => `
    <li>
      <a href="${n.url}" target="_blank" rel="noopener noreferrer">${escapeHtml(n.title)}</a>
      <div class="meta">${escapeHtml(n.source)} ・ ${n.date}</div>
    </li>`).join("");
  return `<ul>${li}</ul>`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

function plClass(v) { return v == null ? "" : (v >= 0 ? "pos" : "neg"); }

function renderCards() {
  const wrap = document.getElementById("cards");
  const rows = getSorted(getFiltered());
  if (rows.length === 0) {
    wrap.innerHTML = '<div class="empty">該当する銘柄がありません</div>';
    return;
  }
  wrap.innerHTML = rows.map((r) => {
    const b = CATEGORY_BADGE[r.category] || CATEGORY_BADGE["様子見"];
    const pcls = plClass(r.pl);
    const pl = r.pl == null ? "N/A" : yenSigned(r.pl);
    const ppct = r.pl_pct == null ? "" : pct(r.pl_pct);
    return `
    <div class="stock" data-code="${r.code}">
      <div class="stock-head">
        <div>
          <div class="stock-name">${escapeHtml(r.name)}</div>
          <div class="stock-code">${r.code} ・ 取得日 ${r.acquired_at}</div>
        </div>
        <span class="badge ${b.cls}" title="${escapeHtml(r.category_reason || "")}">${b.short}</span>
      </div>
      <div class="metrics">
        <div class="metric"><div class="k">株数</div><div class="v">${r.shares.toLocaleString("ja-JP")}</div></div>
        <div class="metric"><div class="k">取得単価</div><div class="v">${fmtPrice(r.cost_price)}</div></div>
        <div class="metric"><div class="k">現在株価</div><div class="v">${fmtPrice(r.current_price)}</div></div>
        <div class="metric"><div class="k">前日比</div><div class="v ${plClass(r.day_change)}">${r.day_change == null ? "N/A" : yenSigned(r.day_change) + " (" + pct(r.day_change_pct) + ")"}</div></div>
        <div class="metric pl"><div class="k">含み損益</div><div class="v ${pcls}">${pl}</div></div>
        <div class="metric pl"><div class="k">含み損益(%)</div><div class="v ${pcls}">${ppct}</div></div>
      </div>
      <div class="news">
        <div class="news-title">直近ニュース</div>
        ${newsList(r.news, 3)}
      </div>
      <div class="observations">
        <div class="k">観察ポイント</div>
        <ul>${(r.observations || []).map((o) => `<li>${escapeHtml(o)}</li>`).join("")}</ul>
      </div>
    </div>`;
  }).join("");

  wrap.querySelectorAll(".stock").forEach((el) => {
    el.addEventListener("click", () => openModal(el.dataset.code));
  });
}

document.querySelectorAll("#filter-bar button").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("#filter-bar button").forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
    state.filter = btn.dataset.filter;
    renderCards();
  });
});
document.getElementById("sort-select").addEventListener("change", (e) => {
  state.sort = e.target.value;
  renderCards();
});

let chart5 = null, chart20 = null;

function openModal(code) {
  const r = DATA.holdings.find((h) => h.code === code);
  if (!r) return;
  const b = CATEGORY_BADGE[r.category] || CATEGORY_BADGE["様子見"];
  const pcls = plClass(r.pl);
  const splitNote = r.split ? `<div class="caveat-small">※ ${escapeHtml(r.split.note)}（適用日 ${r.split.effective_date}）</div>` : "";
  const priceSrc = r.price_source_url ? `<a href="${r.price_source_url}" target="_blank" rel="noopener noreferrer">${escapeHtml(r.price_source || "出典")}</a>` : "";

  const modal = document.getElementById("modal");
  modal.innerHTML = `
    <div class="modal-head">
      <div>
        <h2>${escapeHtml(r.name)}<span class="code">${r.code}</span></h2>
        <div style="margin-top:6px;">
          <span class="badge ${b.cls}">${b.short}</span>
          <span style="font-size:12px;color:var(--muted);margin-left:8px;">${escapeHtml(r.category_reason || "")}</span>
        </div>
      </div>
      <button class="modal-close" aria-label="閉じる">×</button>
    </div>

    <div class="metrics" style="border-top:none; padding-top:0; margin-top:0;">
      <div class="metric"><div class="k">株数</div><div class="v">${r.shares.toLocaleString("ja-JP")}</div></div>
      <div class="metric"><div class="k">取得単価</div><div class="v">${fmtPrice(r.cost_price)}</div></div>
      <div class="metric"><div class="k">現在株価</div><div class="v">${fmtPrice(r.current_price)}</div></div>
      <div class="metric"><div class="k">評価額</div><div class="v">${r.market_value == null ? "N/A" : yen(r.market_value)}</div></div>
      <div class="metric pl"><div class="k">含み損益</div><div class="v ${pcls}">${r.pl == null ? "N/A" : yenSigned(r.pl)}</div></div>
      <div class="metric pl"><div class="k">含み損益(%)</div><div class="v ${pcls}">${r.pl_pct == null ? "N/A" : pct(r.pl_pct)}</div></div>
    </div>

    <div class="grid-charts">
      <div class="chart-card-modal">
        <div class="k">過去5日 (参考表示)</div>
        <div class="chart-wrap-modal"><canvas id="chart-5"></canvas></div>
      </div>
      <div class="chart-card-modal">
        <div class="k">過去20日 (参考表示)</div>
        <div class="chart-wrap-modal"><canvas id="chart-20"></canvas></div>
      </div>
    </div>

    <div class="observations" style="margin-bottom:8px;">
      <div class="k">観察ポイント</div>
      <ul>${(r.observations || []).map((o) => `<li>${escapeHtml(o)}</li>`).join("")}</ul>
    </div>

    <div class="modal-news">
      <h3>直近ニュース（要約）</h3>
      ${(r.news || []).map((n) => `
        <article>
          <div class="ttl"><a href="${n.url}" target="_blank" rel="noopener noreferrer">${escapeHtml(n.title)}</a></div>
          <div class="meta">${escapeHtml(n.source)} ・ ${n.date}</div>
          <div class="sum">${escapeHtml(n.summary || "")}</div>
        </article>`).join("")}
    </div>

    <div class="caveat-small">
      株価出典: ${priceSrc}（${r.as_of || "-"} 時点） / 履歴チャートは取得制約のため参考表示の概算値です。
      投資推奨ではありません。
    </div>
    ${splitNote}
  `;
  modal.querySelector(".modal-close").addEventListener("click", closeModal);

  drawHistoryCharts(r);
  document.getElementById("modal-back").classList.add("open");
}

function closeModal() {
  document.getElementById("modal-back").classList.remove("open");
  if (chart5) { chart5.destroy(); chart5 = null; }
  if (chart20) { chart20.destroy(); chart20 = null; }
}
document.getElementById("modal-back").addEventListener("click", (e) => {
  if (e.target.id === "modal-back") closeModal();
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

function drawLine(canvasId, series, color) {
  const ctx = document.getElementById(canvasId).getContext("2d");
  const labels = series.map((p) => p.date.slice(5));
  const data = series.map((p) => p.price);
  return new Chart(ctx, {
    type: "line",
    data: {
      labels,
      datasets: [{
        data,
        borderColor: color,
        backgroundColor: color + "22",
        fill: true,
        tension: 0.3,
        pointRadius: 2,
        pointHoverRadius: 4,
        borderWidth: 2,
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: (i) => "¥" + i.parsed.y.toLocaleString("ja-JP") } } },
      scales: {
        x: { ticks: { font: { family: "'Noto Sans JP', sans-serif", size: 10 }, color: "#6b7a90", maxRotation: 0, autoSkip: true, maxTicksLimit: 6 }, grid: { display: false } },
        y: { ticks: { font: { family: "'Noto Sans JP', sans-serif", size: 10 }, color: "#6b7a90", callback: (v) => "¥" + Number(v).toLocaleString("ja-JP") }, grid: { color: "#eef1f6" } },
      },
    },
  });
}

function drawHistoryCharts(r) {
  if (chart5) chart5.destroy();
  if (chart20) chart20.destroy();
  if (r.history_5d && r.history_5d.length) chart5 = drawLine("chart-5", r.history_5d, "#1f3a68");
  if (r.history_20d && r.history_20d.length) chart20 = drawLine("chart-20", r.history_20d, "#3b6db5");
}

renderSummary();
renderCards();
</script>
</body>
</html>
